version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: chauffeur-db
    restart: unless-stopped
    ports:
      - "5433:5432" # Expose on 5433 to match your existing local DB port
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sarj123
      POSTGRES_DB: sarj_chauffeur
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: chauffeur-redis
    restart: unless-stopped
    # Reachable only on the docker network (not published to host).
    # Optional host access for debugging:
    # ports:
    #   - "6379:6379"
    # noeviction: never drop rate-limit / OTP keys under pressure (fail write → app memory fallback)
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chauffeur-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to use the docker network hostname 'db' and internal port '5432'
      DATABASE_URL: "postgresql://postgres:sarj123@db:5432/sarj_chauffeur"
      # Abuse protection + SEO redirect cache (override in .env if needed)
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:
